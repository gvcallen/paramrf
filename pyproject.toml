[project]
name = "paramrf"
version = "0.13.12"
description = "Parametric radio frequency modelling, optimization and sampling"
readme = "README.rst"
authors = [
    { name = "Gary Allen", email = "gvcallen@gmail.com" }
]
dependencies = [
    "jax",
    "jaxtyping",
    "equinox",
    "parax",
    "distreqx",
    "optimistix",
    "inferix",
    "matplotlib",
    "numpy",
    "scikit-rf",
    "joblib",
    "tqdm",
    
]

[project.optional-dependencies]
docs = [
    "sphinx",
    "myst-parser",
    "ghp-import",
    "sphinx-rtd-theme",
    "sphinx-math-dollar",
    "ipython",
]
tests = [
    "pytest",
    "ipython",
]

[project.urls]
homepage = "https://github.com/gvcallen/paramrf"

[build-system]
requires = [
    "setuptools>=45",
    "wheel",
    "setuptools_scm[toml]>=6.2",
]
build-backend = 'setuptools.build_meta'

[tool.setuptools.packages.find]
include = ["pmrf"]
