[project]
name = "paramrf"
version = "0.30.3"
description = "Parametric radio frequency modeling"
readme = "README.rst"
authors = [
    { name = "Gary Allen", email = "gvcallen@gmail.com" }
]
dependencies = [
    "parax",
    "threadpoolctl",
    "eqxpress",
    "jax",
    "jaxtyping",
    "equinox",
    "distreqx",
    "optimistix",
    "lineax",
    "jaxopt",
    "numpy",
    "scipy",
    "scikit-rf",
    "tqdm",
    "jax-tqdm",
]

[project.optional-dependencies]
docs = [
    "sphinx",
    "nbsphinx",
    "pandoc",
    "myst-parser",
    "ghp-import",
    "sphinx-rtd-theme",
    "sphinx-math-dollar",
    "ipython",
    "matplotlib",
    "jupyter-sphinx",
]
tests = [
    "pytest",
    "ipython",
    "scikit-rf",
    "anesthetic",
    "mpi4py",
    "blackjax",
]

[project.urls]
homepage = "https://github.com/gvcallen/paramrf"

[build-system]
requires = [
    "setuptools>=45",
    "wheel",
    "setuptools_scm[toml]>=6.2",
]
build-backend = 'setuptools.build_meta'

[tool.setuptools.packages.find]
include = ["pmrf"]
