name: Run Tests

on:
  push:
    branches: [main]
    tags: [ "v*" ]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repo
      uses: actions/checkout@v4

    - name: Install Compilers and MPI
      run: |
        sudo apt-get update
        sudo apt-get install -y gfortran libopenmpi-dev openmpi-bin

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies and smoke test package import
      run: scripts/install-test-deps.sh

    - name: Run Pytest
      run: |
        python -m pytest -rs
      env:
        PMRF_TESTS_NO_SKIPS: "1"
