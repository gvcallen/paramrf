name: Run Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repo
      uses: actions/checkout@v4

    - name: Install Compilers and MPI
      run: |
        sudo apt-get update
        sudo apt-get install -y gfortran libopenmpi-dev openmpi-bin

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e .[tests]

    - name: Smoke test package import
      run: python -I -c "import pmrf"

    - name: Install test backend overrides
      run: |
        pip uninstall -y distreqx
        pip install "git+https://github.com/gvcallen/distreqx.git"
        pip install "git+https://github.com/PolyChord/PolyChordLite.git"
        pip install git+https://github.com/handley-lab/blackjax.git@v0.1.0-beta

    - name: Run Pytest
      run: |
        python -m pytest
