name: Run Tests

on:
  push:
    branches: [main]
    tags: [ "v*" ]
    paths-ignore:
      - "docs/**"
      - "paper/**"
      - "**.md"
      - "**.rst"
  pull_request:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "paper/**"
      - "**.md"
      - "**.rst"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: test (shard ${{ matrix.shard }}/${{ strategy.job-total }})
    runs-on: ubuntu-latest
    # A shard should take 10–20 min; a hung sampler must not hold the runner for hours.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # tests/conftest.py balances whole files across shards by tests/durations.json.
        shard: [1, 2, 3, 4]

    steps:
    - name: Checkout repo
      uses: actions/checkout@v4

    - name: Install Compilers and MPI
      run: |
        sudo apt-get update
        sudo apt-get install -y gfortran libopenmpi-dev openmpi-bin

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: pip
        cache-dependency-path: pyproject.toml

    - name: Install dependencies and smoke test package import
      run: scripts/install-test-deps.sh

    # Each shard saves under its own key and restores its newest earlier one, so the cache
    # follows the code and the shard's files. conftest.py caps its size.
    - name: Restore JAX compilation cache
      uses: actions/cache@v4
      with:
        path: .jax_cache
        key: jax-${{ runner.os }}-${{ hashFiles('pyproject.toml') }}-shard${{ matrix.shard }}of${{ strategy.job-total }}-${{ github.sha }}
        restore-keys: |
          jax-${{ runner.os }}-${{ hashFiles('pyproject.toml') }}-shard${{ matrix.shard }}of${{ strategy.job-total }}-
          jax-${{ runner.os }}-${{ hashFiles('pyproject.toml') }}-
          jax-${{ runner.os }}-

    - name: Run Pytest
      run: |
        python -m pytest -rs -n auto --durations=25 --shard ${{ matrix.shard }}/${{ strategy.job-total }}
      env:
        PMRF_TESTS_NO_SKIPS: "1"
